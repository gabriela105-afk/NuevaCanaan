# Configuración declarativa para Render (Blueprint).
# Documentación: https://render.com/docs/blueprint-spec
#
# NOTA IMPORTANTE SOBRE PERSISTENCIA:
# El sistema de archivos de un Web Service de Render es EFÍMERO.
# Para conservar la base SQLite entre despliegues/reinicios se declara un
# disco persistente montado en /var/data y la base vive en /var/data/.
# El disco persistente requiere un plan de pago de Render; verifique las
# condiciones del plan antes de asumir persistencia.

services:
  - type: web
    name: nueva-canaan
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    # Un único worker con varios hilos: SQLite no soporta escrituras concurrentes
    # de varios procesos. La inicialización de datos se ejecuta UNA sola vez
    # (init_and_seed es idempotente y protegido por el bloqueo de la tabla de
    # ajustes institucionales).
    startCommand: "python -m app.cli init-and-seed && gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/nueva_canaan.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
    disk:
      name: nueva-canaan-data
      mountPath: /var/data
      sizeGB: 1
