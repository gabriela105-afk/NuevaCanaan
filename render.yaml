# Configuración declarativa para Render (Blueprint).
# Documentación: https://render.com/docs/blueprint-spec
#
# ARQUITECTURA
#   Render  -> ejecuta Flask con Gunicorn y sirve el muro público.
#   Base de datos -> SQLite por defecto; DATABASE_URL permite usar PostgreSQL
#                    (por ejemplo Supabase) o SQLite en un disco persistente.
#
# El comando de arranque crea las tablas y la cuenta administradora de forma
# idempotente antes de iniciar Gunicorn.
#
# PERSISTENCIA
#   El sistema de archivos de un Web Service gratuito es EFÍMERO. Las fotografías
#   se pierden al redesplegar salvo que se use un disco persistente (plan de pago):
#     1) Descomentar el bloque `disk`.
#     2) Definir UPLOAD_FOLDER=/var/data/uploads en el panel de Render.
#   Si además se desea SQLite persistente, definir:
#     DATABASE_URL=sqlite:////var/data/nueva_canaan.db
#   Si DATABASE_URL apunta a Supabase/PostgreSQL, las publicaciones persisten sin
#   necesidad de disco; las fotografías siguen necesitando el disco.

services:
  - type: web
    name: nueva-canaan
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m app.cli init-and-seed && gunicorn wsgi:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Cadena de conexión de Supabase (opcional). Si no se define, se usa SQLite
      # local en instance/nueva_canaan.db (efímero en el plan gratuito).
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # - key: UPLOAD_FOLDER
      #   value: /var/data/uploads
    # --- Sólo con plan de pago (disco persistente para fotografías) ---
    # disk:
    #   name: nueva-canaan-data
    #   mountPath: /var/data
    #   sizeGB: 1
