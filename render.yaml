# Configuración declarativa para Render (Blueprint).
# Documentación: https://render.com/docs/blueprint-spec
#
# ARQUITECTURA
#   Render  -> ejecuta Flask con Gunicorn y sirve el muro público.
#   Base de datos -> SQLite por defecto; DATABASE_URL permite usar PostgreSQL
#                    (por ejemplo Supabase) o SQLite en un disco persistente.
#
# El comando de arranque crea las tablas y la cuenta administradora de forma
# idempotente antes de iniciar Gunicorn.
#
# PERSISTENCIA
#   El sistema de archivos de un Web Service gratuito es EFÍMERO.
#   - Fotografías: definir SUPABASE_URL, SUPABASE_SERVICE_KEY y
#     SUPABASE_STORAGE_BUCKET para guardarlas en Supabase Storage. Si no se
#     definen, se usa el disco local y se pierden al redesplegar.
#   - Base de datos: DATABASE_URL apunta a PostgreSQL/Supabase.
#   - Alternativa sin Supabase Storage (plan de pago): descomentar `disk` y
#     definir UPLOAD_FOLDER=/var/data/uploads.
#   - SQLite persistente opcional:
#     DATABASE_URL=sqlite:////var/data/nueva_canaan.db

services:
  - type: web
    name: nueva-canaan
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m app.cli init-and-seed && gunicorn wsgi:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Cadena de conexión de Supabase. Es NECESARIA para que las publicaciones
      # persistan: sin ella se usa SQLite en el disco efímero y se pierden al
      # redesplegar. Copiar en Supabase → Connect → Transaction pooler (6543):
      #   postgresql://postgres.kznbowtnjankvyqsntfu:CONTRASEÑA@aws-1-us-east-2.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Supabase Storage para que las fotografías sobrevivan a los despliegues.
      # SUPABASE_URL es la URL BASE del proyecto
      # (https://<ref>.supabase.co), NO la de /rest/v1 ni /storage/v1.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: nueva-canaan
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_PUBLIC
        value: "false"
      # - key: UPLOAD_FOLDER
      #   value: /var/data/uploads
    # --- Sólo con plan de pago (disco persistente para fotografías) ---
    # disk:
    #   name: nueva-canaan-data
    #   mountPath: /var/data
    #   sizeGB: 1
