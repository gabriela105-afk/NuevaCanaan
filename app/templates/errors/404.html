{% extends "base.html" %}
{% block title %}Página no encontrada{% endblock %}
{% block content %}
  <section class="section">
    <div class="container" style="max-width: 640px;">
      <div class="card text-center">
        <h1>Página no encontrada</h1>
        <p class="muted">
          La dirección solicitada no existe o el contenido fue retirado. Verifique el
          enlace o utilice el menú de navegación.
        </p>
        <div class="form-actions" style="justify-content: center;">
          <a class="btn btn--primary" href="{{ url_for('main.index') }}">Volver al inicio</a>
          <a class="btn btn--ghost" href="{{ url_for('announcements.index') }}">Ver comunicados</a>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
