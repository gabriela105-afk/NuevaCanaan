{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
  <section class="login-wrap">
    <div class="card login-card">
      <span class="avatar avatar--large" aria-hidden="true">NC</span>
      <h1>Acceso administrador</h1>
      <p class="muted">Ingrese con la cuenta administradora del colegio. No existe registro público.</p>

      <form method="post" action="{{ url_for('main.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" value="{{ email }}" required
                 autocomplete="username" autofocus maxlength="180">
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required
                 autocomplete="current-password">
        </div>

        <label class="check">
          <input type="checkbox" name="remember" value="1">
          <span>Mantener la sesión iniciada en este dispositivo</span>
        </label>

        <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
      </form>

      <p class="login-back">
        <a href="{{ url_for('main.index') }}">‹ Volver al muro de noticias</a>
      </p>
    </div>
  </section>
{% endblock %}
